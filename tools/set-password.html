<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Set site password</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body { padding: 64px 24px; max-width: 760px; }
    h1 { font-size: 40px; font-weight: 300; line-height: 1.1; margin: 0 0 24px; }
    p { margin-bottom: 16px; }
    input { font: inherit; font-size: 20px; width: 100%; padding: 12px 0; border: 0; border-bottom: 1px solid #000; outline: 0; margin-bottom: 24px; }
    code, pre { font-family: var(--font-mono); font-size: 13px; }
    pre { background: var(--surface); padding: 16px; white-space: pre-wrap; word-break: break-all; min-height: 52px; margin: 0 0 16px; }
  </style>
</head>
<body>
  <h1>Set the site password</h1>
  <p>Type the new password. Nothing is sent anywhere; this page only does the maths in your browser.</p>
  <input id="pw" type="text" placeholder="New password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p>Then open <code>assets/js/gate.js</code> and replace the <code>PASSWORD_HASH</code> line with this:</p>
  <pre id="out">—</pre>
  <p>Anyone who unlocked with the old password will be asked again.</p>
  <script>
    const SALT = "sarahspitler.com::";
    const pw = document.getElementById("pw"), out = document.getElementById("out");
    pw.addEventListener("input", async () => {
      if (!pw.value) { out.textContent = "—"; return; }
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT + pw.value));
      const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
      out.textContent = `const PASSWORD_HASH = "${hex}";`;
    });
  </script>
</body>
</html>
